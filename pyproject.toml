[project]
name = "langchain-rag"
version = "0.1.0"
description = ""
authors = [
    {name = "Nikolai Kircher",email = "nikolai.kircher@nttdata.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "python-dotenv (>=1.2.4,<2.0.0)",
    "langchain-openai (>=1.8.0,<2.0.0)",
    "streamlit (>=1.67.0,<2.0.0)",
    "langchain-weaviate (>=0.0.8,<0.0.9)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "pypdf (>=7.1.0,<8.0.0)",
    "langchain (>=1.0,<2.0)"
]

[tool.poetry]
packages = [{include = "langchain_rag", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
